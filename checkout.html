<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="Electric vehicle marketplace"
>

<meta
name="keywords"
content="electric cars, EV cars, tesla, vehicles"
>

<title>Checkout</title>

<link
rel="stylesheet"
href="style.css"
>

</head>

<body>

<h1>Checkout 🧾</h1>

<div id="checkoutItems"></div>

<h2 id="checkoutTotal"></h2>

<hr>

<input
type="text"
id="customerName"
placeholder="Full Name"hidden
>

<input
type="email"
id="customerEmail"
placeholder="Email Address"
hidden
>

<input
type="text"
id="customerPhone"
placeholder="Phone Number"
>

<textarea
id="customerAddress"
placeholder="Delivery Address"
></textarea>


<button id="placeOrderBtn">
Place Order
</button>

<select id="paymentMethod">

<option value="cash">
Cash On Delivery
</option>

<option value="bank">
Bank Transfer
</option>

<option value="pickup">
Pay On Pickup
</option>

</select>

<div id="bankDetails">

<h3>Bank Details</h3>

<p>Bank: GTBank</p>

<p>Account Name: EV Cars Ltd</p>

<p>Account Number: 1234567890</p>

</div>


<script
type="module"
src="checkout.js"
></script>

</body>
</html>
