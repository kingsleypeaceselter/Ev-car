<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<meta
name="description"
content="Electric vehicle marketplace"
>

<meta
name="keywords"
content="electric cars, EV cars, tesla, vehicles"
>

<title>Checkout</title>

<link
rel="stylesheet"
href="style.css"
>

</head>

<body>

<h1>Checkout 🧾</h1>

<div id="checkoutItems"></div>

<h2 id="checkoutTotal"></h2>

<hr>

<input
type="text"
id="customerName"
placeholder="Full Name"
>

<input
type="email"
id="customerEmail"
placeholder="Email Address"
>

<input
type="text"
id="customerPhone"
placeholder="Phone Number"
>

<textarea
id="customerAddress"
placeholder="Delivery Address"
></textarea>


<button id="placeOrderBtn">
Place Order
</button>

<script
type="module"
src="checkout.js"
></script>

</body>
</html>
